<head>
  <meta charset="UTF-8">

  <title>SAFARIA Admin Panel</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;

    }

    #authScreen {
      min-height: 100vh;
      display: flex;

      justify-content: center;

    }

    #authBox {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;

    header {

      padding: 15px;

    header button {

    .message {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      background: white;
    }

    .product img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 6px;
      background: #f9fafb;
      margin-bottom: 10px;
    }

    .product h3 {
      margin-bottom: 6px;
    }

    .price {
      color: #b12704;
      font-size: 18px;
      font-weight: bold;

    }

    .product-info {
      color: #555;
      font-size: 14px;
      margin: 4px 0;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .edit,
    .delete {
      flex: 1;
      color: white;
    }

    .edit {
      background: #2563eb;
    }

    .delete {
      background: #dc2626;
    }

    .order {
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .order-id {
      font-weight: bold;
      color: #2563eb;
    }

    .order-details {
      line-height: 1.7;
      font-size: 14px;
    }

    .status-select {
      width: auto;
      min-width: 150px;
      padding: 8px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .form-grid,
      .products {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style></head><body><!-- LOGIN CHECK SCREEN --><div id="authScreen">
  <div id="authBox">
    <h2>🔐 SAFARIA Admin</h2>
    <p id="authMessage">Checking administrator access...</p>
  </div>
</div><!-- ADMIN PANEL --><div id="adminContent">  <header>
    <h1>SAFARIA Admin</h1><div class="header-buttons">
  <a href="index.html">🏠 Store</a>
  <button type="button" onclick="logout()">🚪 Logout</button>
</div>

  </header>  <div class="container"><!-- DASHBOARD -->
<div class="stats">

  <div class="stat">
    <h3>Total Orders</h3>
    <p id="totalOrders">0</p>
  </div>

  <div class="stat">
    <h3>Pending</h3>
    <p id="pendingOrders">0</p>
  </div>

  <div class="stat">
    <h3>Delivered</h3>
    <p id="deliveredOrders">0</p>
  </div>

  <div class="stat">
    <h3>Revenue</h3>
    <p id="revenue">₹0</p>
  </div>

</div>


<!-- PRODUCT MANAGEMENT -->
<div class="card">

  <h2>🛍️ Product Management</h2>

  <div class="form-grid">

    <input id="productName"
           type="text"
           placeholder="Product Name"
           maxlength="150">

    <input id="productPrice"
           type="number"
           placeholder="Price"
           min="0"
           step="0.01">

    <input id="productImage"
           type="text"
           placeholder="Product Image URL"
           maxlength="1000">

    <input id="productCategory"
           type="text"
           placeholder="Category"
           maxlength="100">

    <input id="productStock"
           type="number"
           placeholder="Stock"
           min="0"
           step="1">

    <textarea id="productDescription"
              class="full"
              placeholder="Product Description"
              maxlength="2000"></textarea>

    <div class="full">

      <button id="saveProductBtn"
              class="add-btn"
              type="button"
              onclick="saveProduct()">
        ➕ Add Product
      </button>

      <button id="cancelEditBtn"
              class="cancel-btn"
              type="button"
              onclick="cancelEdit()">
        Cancel
      </button>

    </div>

  </div>

  <div id="productMessage" class="message"></div>

</div>


<!-- PRODUCTS -->
<div class="card">

  <h2>📦 Products</h2>

  <div id="productsList">
    <div class="empty">Loading products...</div>
  </div>

</div>


<!-- ORDERS -->
<div class="card">

  <h2>📋 Orders</h2>

  <div id="ordersList">
    <div class="empty">Loading orders...</div>
  </div>

</div>

  </div>
</div><script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://dcwdzbejpwvskajukxrh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_1IsM8N7-OEcBJyIH5HnsFw_cl6F5oPU";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     ADMIN EMAIL
  ========================= */

  const ADMIN_EMAIL =
    "sajidshaikh10822@gmail.com";


  let adminVerified = false;
  let editingProductId = null;
  let redirecting = false;


  /* =========================
     AUTH CHECK
  ========================= */

  async function checkAdminAccess() {

    const message =
      document.getElementById("authMessage");

    try {

      const result =
        await supabaseClient.auth.getSession();

      if (result.error) {
        throw result.error;
      }

      const session =
        result.data.session;


      /* NO LOGIN */

      if (!session || !session.user) {

        message.textContent =
          "❌ Login required. Redirecting...";

        redirectToLogin();

        return;
      }


      /* CHECK EMAIL */

      const email =
        String(
          session.user.email || ""
        ).trim().toLowerCase();


      if (
        email !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        message.textContent =
          "❌ Access denied. Admin account required.";

        await supabaseClient.auth.signOut();

        redirectToLogin();

        return;
      }


      /* ADMIN VERIFIED */

      adminVerified = true;

      document.getElementById(
        "authScreen"
      ).style.display = "none";

      document.getElementById(
        "adminContent"
      ).style.display = "block";


      await loadProducts();
      await loadOrders();

    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ Authentication error. Redirecting...";

      redirectToLogin();

    }
  }


  /* =========================
     REDIRECT
  ========================= */

  function redirectToLogin() {

    if (redirecting) return;

    redirecting = true;

    window.location.replace("auth.html");

  }


  /* =========================
     AUTH LISTENER
  ========================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (
        event === "SIGNED_OUT" ||
        !session
      ) {

        adminVerified = false;

        redirectToLogin();

      }

    }
  );


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    if (!adminVerified) return;

    try {

      await supabaseClient.auth.signOut();

      adminVerified = false;

      redirectToLogin();

    } catch (error) {

      console.error(error);

      alert(
        "Logout failed: " +
        (error.message || "Unknown error")
      );

    }

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(text, type) {

    const box =
      document.getElementById(
        "productMessage"
      );

    box.textContent = text;

    box.className =
      "message " + type;

    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);

  }


  /* =========================
     SAVE PRODUCT
  ========================= */

  async function saveProduct() {

    if (!adminVerified) {
      redirectToLogin();
      return;
    }


    const name =
      document.getElementById(
        "productName"
      ).value.trim();

    const description =
      document.getElementById(
        "productDescription"
      ).value.trim();

    const price =
      Number(
        document.getElementById(
          "productPrice"
        ).value
      );

    const image =
      document.getElementById(
        "productImage"
      ).value.trim();

    const category =
      document.getElementById(
        "productCategory"
      ).value.trim();

    const stock =
      Number(
        document.getElementById(
          "productStock"
        ).value
      );


    if (!name) {
      showMessage(
        "Product name required.",
        "error"
      );
      return;
    }

    if (!Number.isFinite(price) || price < 0) {
      showMessage(
        "Please enter a valid price.",
        "error"
      );
      return;
    }

    if (!image) {
      showMessage(
        "Product image URL required.",
        "error"
      );
      return;
    }

    if (!category) {
      showMessage(
        "Category required.",
        "error"
      );
      return;
    }

    if (!Number.isFinite(stock) || stock < 0) {
      showMessage(
        "Please enter valid stock.",
        "error"
      );
      return;
    }


    const productData = {
      name,
      description,
      price,
      image,
      category,
      stock
    };


    const button =
      document.getElementById(
        "saveProductBtn"
      );

    button.disabled = true;

    try {

      let result;

      if (editingProductId) {

        result =
          await supabaseClient
            .from("products")
            .update(productData)
            .eq("id", editingProductId);

      } else {

        result =
          await supabaseClient
            .from("products")
            .insert([productData]);

      }


      if (result.error) {
        throw result.error;
      }


      showMessage(
        editingProductId
          ? "✅ Product updated successfully!"
          : "✅ Product added successfully!",
        "success"
      );


      clearForm();

      await loadProducts();

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ " +
        (error.message || "Product save failed"),
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "➕ Add Product";

    }

  }


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    if (!adminVerified) return;

    const list =
      document.getElementById(
        "productsList"
      );

    list.innerHTML =
      '<div class="empty">Loading products...</div>';


    try {

      const result =
        await supabaseClient
          .from("products")
          .select("*")
          .order("id", {
            ascending: false
          });


      if (result.error) {
        throw result.error;
      }


      const data =
        result.data || [];


      if (data.length === 0) {

        list.innerHTML =
          '<div class="empty">No products added yet.</div>';

        return;
      }


      list.innerHTML = "";


      data.forEach(product => {

        const card =
          document.createElement("div");

        card.className = "product";


        const image =
          escapeHTML(product.image || "");

        const name =
          escapeHTML(product.name || "");

        const category =
          escapeHTML(
            product.category || "General"
          );

        const description =
          escapeHTML(
            product.description || ""
          );


        card.innerHTML = `
          <img
            src="${image}"
            alt="${name}"
            onerror="this.style.display='none'"
          >

          <h3>${name}</h3>

          <div class="price">
            ₹${Number(
              product.price || 0
            ).toLocaleString("en-IN")}
          </div>

          <div class="product-info">
            📂 ${category}
          </div>

          <div class="product-info">
            📦 Stock: ${Number(
              product.stock || 0
            )}
          </div>

          <div class="product-info">
            ${description}
          </div>

          <div class="actions">

            <button
              class="edit"
              type="button">
              ✏️ Edit
            </button>

            <button
              class="delete"
              type="button">
              🗑️ Delete
            </button>

          </div>
        `;


        card
          .querySelector(".edit")
          .onclick = () =>
            editProduct(product);


        card
          .querySelector(".delete")
          .onclick = () =>
            deleteProduct(product.id);


        list.appendChild(card);

      });

    } catch (error) {

      console.error(error);

      list.innerHTML =
        '<div class="empty">❌ Failed to load products.</div>';

    }

  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  function editProduct(product) {

    if (!adminVerified) {
      redirectToLogin();
      return;
    }


    editingProductId =
      product.id;


    document.getElementById(
      "productName"
    ).value =
      product.name || "";


    document.getElementById(
      "productDescription"
    ).value =
      product.description || "";


    document.getElementById(
      "productPrice"
    ).value =
      product.price ?? "";


    document.getElementById(
      "productImage"
    ).value =
      product.image || "";


    document.getElementById(
      "productCategory"
    ).value =
      product.category || "";


    document.getElementById(
      "productStock"
    ).value =
      product.stock ?? 0;


    document.getElementById(
      "saveProductBtn"
    ).textContent =
      "💾 Update Product";


    document.getElementById(
      "cancelEditBtn"
    ).style.display =
      "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================
     CANCEL EDIT
  ========================= */

  function cancelEdit() {

    editingProductId = null;

    clearForm();

  }


  /* =========================
     CLEAR FORM
  ========================= */

  function clearForm() {

    document.getElementById(
      "productName"
    ).value = "";

    document.getElementById(
      "productDescription"
    ).value = "";

    document.getElementById(
      "productPrice"
    ).value = "";

    document.getElementById(
      "productImage"
    ).value = "";

    document.getElementById(
      "productCategory"
    ).value = "";

    document.getElementById(
      "productStock"
    ).value = "";

    editingProductId = null;

    document.getElementById(
      "saveProductBtn"
    ).textContent =
      "➕ Add Product";

    document.getElementById(
      "cancelEditBtn"
    ).style.display =
      "none";

  }


  /* =========================
     DELETE PRODUCT
  ========================= */

  async function deleteProduct(id) {

    if (!adminVerified) {
      redirectToLogin();
      return;
    }


    const ok =
      confirm(
        "Are you sure you want to delete this product?"
      );

    if (!ok) return;


    try {

      const result =
        await supabaseClient
          .from("products")
          .delete()
          .eq("id", id);


      if (result.error) {
        throw result.error;
      }


      showMessage(
        "✅ Product deleted successfully!",
        "success"
      );


      await loadProducts();

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ " +
        (error.message || "Delete failed"),
        "error"
      );

    }

  }


  /* =========================
     LOAD ORDERS
  ========================= */

  async function loadOrders() {

    if (!adminVerified) return;

    const list =
      document.getElementById(
        "ordersList"
      );


    list.innerHTML =
      '<div class="empty">Loading orders...</div>';


    try {

      const result =
        await supabaseClient
          .from("orders")
          .select("*")
          .order("id", {
            ascending: false
          });


      if (result.error) {
        throw result.error;
      }


      const orders =
        result.data || [];


      document.getElementById(
        "totalOrders"
      ).textContent =
        orders.length;


      const pending =
        orders.filter(order =>
          String(
            order.status || "
