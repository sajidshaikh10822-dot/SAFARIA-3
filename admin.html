<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFARIA Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    .auth-box h1 {
      margin-bottom: 15px;
    }

    #authMessage {
      color: #555;
      line-height: 1.6;
    }

    #adminContent {
      display: none;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 22px;
    }

    .logout-btn {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .stat-card p {
      font-size: 25px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .section h2 {
      margin-bottom: 18px;
      font-size: 21px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 11px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .warning {
      background: #f59e0b;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .secondary {
      background: #6b7280;
      color: white;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .product-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f3f4f6;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-info p {
      color: #666;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .product-price {
      font-size: 19px;
      font-weight: bold;
      margin: 10px 0;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .product-actions button {
      flex: 1;
    }

    .orders-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    .status-select {
      min-width: 130px;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .success-msg {
      background: #dcfce7;
      color: #166534;
    }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
    }

    .order-items {
      min-width: 180px;
    }

    .order-item {
      margin-bottom: 5px;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 15px 10px 40px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <h1>SAFARIA Admin</h1>
      <p id="authMessage">Checking administrator access...</p>
    </div>
  </div>

  <!-- ADMIN CONTENT -->
  <div id="adminContent">

    <header>
      <h1>🛍️ SAFARIA Admin Panel</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <main class="container">

      <!-- STATS -->
      <div class="stats">

        <div class="stat-card">
          <h3>Total Orders</h3>
          <p id="totalOrders">0</p>
        </div>

        <div class="stat-card">
          <h3>Pending Orders</h3>
          <p id="pendingOrders">0</p>
        </div>

        <div class="stat-card">
          <h3>Delivered Orders</h3>
          <p id="deliveredOrders">0</p>
        </div>

        <div class="stat-card">
          <h3>Total Revenue</h3>
          <p id="totalRevenue">₹0</p>
        </div>

      </div>

      <!-- ADD PRODUCT -->
      <section class="section">

        <h2 id="formTitle">➕ Add Product</h2>

        <div id="productMessage" class="message"></div>

        <div class="form-grid">

          <div class="form-group">
            <label>Product Name</label>
            <input id="productName" type="text" placeholder="Enter product name">
          </div>

          <div class="form-group">
            <label>Category</label>
            <input id="productCategory" type="text" placeholder="e.g. Electronics">
          </div>

          <div class="form-group">
            <label>Price (₹)</label>
            <input id="productPrice" type="number" min="0" step="0.01" placeholder="Enter price">
          </div>

          <div class="form-group">
            <label>Stock</label>
            <input id="productStock" type="number" min="0" step="1" placeholder="Enter stock">
          </div>

          <div class="form-group full">
            <label>Image URL</label>
            <input id="productImage" type="url" placeholder="https://example.com/image.jpg">
          </div>

          <div class="form-group full">
            <label>Description</label>
            <textarea id="productDescription" placeholder="Enter product description"></textarea>
          </div>

        </div>

        <div class="buttons">

          <button class="primary" onclick="saveProduct()">
            💾 Save Product
          </button>

          <button
            id="cancelEditBtn"
            class="secondary"
            onclick="cancelEdit()"
            style="display:none;"
          >
            Cancel Edit
          </button>

          <button class="secondary" onclick="clearForm()">
            Clear
          </button>

        </div>

      </section>

      <!-- PRODUCTS -->
      <section class="section">

        <h2>📦 Products</h2>

        <div id="productsContainer">
          <div class="loading">Loading products...</div>
        </div>

      </section>

      <!-- ORDERS -->
      <section class="section">

        <h2>🧾 Customer Orders</h2>

        <div id="ordersMessage" class="message"></div>

        <div class="orders-wrapper">

          <div id="ordersContainer">
            <div class="loading">Loading orders...</div>
          </div>

        </div>

      </section>

    </main>

  </div>

<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://dcwdzbejpwvskajukxrh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_1IsM8N7-OEcBJyIH5HnsFw_cl6F5oPU";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ADMIN
  ========================================= */

  const ADMIN_EMAIL =
    "sajidshaikh10822@gmail.com";

  let adminVerified = false;
  let editingProductId = null;
  let redirecting = false;


  /* =========================================
     START
  ========================================= */

  window.addEventListener("load", function() {
    checkAdminAccess();
  });


  /* =========================================
     AUTH CHECK
  ========================================= */

  async function checkAdminAccess() {

    const message =
      document.getElementById("authMessage");

    try {

      message.textContent =
        "Checking administrator access...";

      const {
        data,
        error
      } = await supabaseClient.auth.getSession();

      if (error) {
        throw error;
      }

      const session = data.session;

      if (!session || !session.user) {

        message.textContent =
          "❌ Please login as administrator.";

        setTimeout(function() {
          redirectToLogin();
        }, 500);

        return;
      }

      const email =
        String(session.user.email || "")
          .trim()
          .toLowerCase();

      if (
        email !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        message.textContent =
          "❌ Access denied. Admin account required.";

        await supabaseClient.auth.signOut();

        setTimeout(function() {
          redirectToLogin();
        }, 500);

        return;
      }

      adminVerified = true;

      document.getElementById(
        "authScreen"
      ).style.display = "none";

      document.getElementById(
        "adminContent"
      ).style.display = "block";

      await loadProducts();
      await loadOrders();

    } catch (error) {

      console.error(
        "Admin authentication error:",
        error
      );

      message.innerHTML =
        "❌ Authentication error.<br><br>" +
        escapeHtml(
          error.message ||
          "Unable to verify administrator."
        );

      /*
        Do not immediately redirect.
        This lets us see the actual Supabase error.
      */

    }

  }


  /* =========================================
     LOGIN REDIRECT
  ========================================= */

  function redirectToLogin() {

    if (redirecting) return;

    redirecting = true;

    const loginUrl =
      new URL(
        "auth.html",
        window.location.href
      ).href;

    window.location.href =
      loginUrl;
  }


  /* =========================================
     AUTH LISTENER
  ========================================= */

  supabaseClient.auth.onAuthStateChange(
    function(event, session) {

      if (event === "SIGNED_OUT") {

        adminVerified = false;

        if (
          !window.location.pathname
            .toLowerCase()
            .endsWith("auth.html")
        ) {
          redirectToLogin();
        }
      }

    }
  );


  /* =========================================
     LOGOUT
  ========================================= */

  async function logout() {

    try {

      await supabaseClient.auth.signOut();

    } catch (error) {

      console.error(error);

    }

  }


  /* =========================================
     FORM DATA
  ========================================= */

  function getProductFormData() {

    return {

      name:
        document.getElementById(
          "productName"
        ).value.trim(),

      description:
        document.getElementById(
          "productDescription"
        ).value.trim(),

      price:
        Number(
          document.getElementById(
            "productPrice"
          ).value
        ),

      image:
        document.getElementById(
          "productImage"
        ).value.trim(),

      category:
        document.getElementById(
          "productCategory"
        ).value.trim(),

      stock:
        Number(
          document.getElementById(
            "productStock"
          ).value
        )

    };

  }


  /* =========================================
     SAVE PRODUCT
  ========================================= */

  async function saveProduct() {

    if (!adminVerified) {

      alert("Admin access required.");
      return;

    }

    const data =
      getProductFormData();

    if (!data.name) {

      alert("Please enter product name.");
      return;

    }

    if (
      Number.isNaN(data.price) ||
      data.price < 0
    ) {

      alert("Please enter a valid price.");
      return;

    }

    if (
      Number.isNaN(data.stock) ||
      data.stock < 0
    ) {

      alert("Please enter a valid stock.");
      return;

    }

    try {

      let result;

      if (editingProductId !== null) {

        result =
          await supabaseClient
            .from("products")
            .update(data)
            .eq(
              "id",
              editingProductId
            );

      } else {

        result =
          await supabaseClient
            .from("products")
            .insert([data]);

      }

      if (result.error) {
        throw result.error;
      }

      showProductMessage(
        editingProductId !== null
          ? "✅ Product updated successfully."
          : "✅ Product added successfully.",
        true
      );

      clearForm();

      await loadProducts();

    } catch (error) {

      console.error(error);

      showProductMessage(
        "❌ " +
        (
          error.message ||
          "Failed to save product."
        ),
        false
      );

    }

  }


  /* =========================================
     LOAD PRODUCTS
  ========================================= */

  async function loadProducts() {

    const container =
      document.getElementById(
        "productsContainer"
      );

    container.innerHTML =
      '<div class="loading">Loading products...</div>';

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );

      if (error) {
        throw error;
      }

      const products =
        data || [];

      if (!products.length) {

        container.innerHTML =
          '<div class="empty">No products found.</div>';

        return;
      }

      let html =
        '<div class="products-grid">';

      products.forEach(function(product) {

        const image =
          product.image ||
          "https://via.placeholder.com/500x350?text=SAFARIA";

        html += `

          <div class="product-card">

            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name || "Product")}"
              onerror="this.src='https://via.placeholder.com/500x350?text=SAFARIA'"
            >

            <div class="product-info">

              <h3>
                ${escapeHtml(
                  product.name ||
                  "Unnamed Product"
                )}
              </h3>

              <p>
                Category:
                ${escapeHtml(
                  product.category ||
                  "N/A"
                )}
              </p>

              <p>
                Stock:
                ${Number(product.stock || 0)}
              </p>

              <div class="product-price">
                ₹${formatMoney(product.price)}
              </div>

              <p>
                ${escapeHtml(
                  product.description ||
                  ""
                )}
              </p>

              <div class="product-actions">

                <button
                  class="warning"
                  onclick="editProduct('${String(product.id)}')"
                >
                  Edit
                </button>

                <button
                  class="danger"
                  onclick="deleteProduct('${String(product.id)}')"
                >
                  Delete
                </button>

              </div>

            </div>

          </div>

        `;

      });

      html += "</div>";

      container.innerHTML =
        html;

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          ❌ Failed to load products.<br><br>
          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}
        </div>
      `;

    }

  }


  /* =========================================
     EDIT PRODUCT
  ========================================= */

  async function editProduct(id) {

    if (!adminVerified) return;

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select("*")
          .eq("id", id)
          .single();

      if (error) {
        throw error;
      }

      const product =
        data;

      editingProductId =
        product.id;

      document.getElementById(
        "productName"
      ).value =
        product.name || "";

      document.getElementById(
        "productDescription"
      ).value =
        product.description || "";

      document.getElementById(
        "productPrice"
      ).value =
        product.price ?? "";

      document.getElementById(
        "productImage"
      ).value =
        product.image || "";

      document.getElementById(
        "productCategory"
      ).value =
        product.category || "";

      document.getElementById(
        "productStock"
      ).value =
        product.stock ?? "";

      document.getElementById(
        "formTitle"
      ).textContent =
        "✏️ Edit Product";

      document.getElementById(
        "cancelEditBtn"
      ).style.display =
        "inline-block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } catch (error) {

      console.error(error);

      alert(
        "Failed to load product: " +
        (
          error.message ||
          "Unknown error"
        )
      );

    }

  }


  /* =========================================
     DELETE PRODUCT
  ========================================= */

  async function deleteProduct(id) {

    if (!adminVerified) return;

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );

    if (!confirmed) return;

    try {

      const {
        erro
