<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAFARIA - Checkout</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #131921;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
    }

    .box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      gap: 15px;
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
      align-items: center;
    }

    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 8px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .item-price {
      color: #b12704;
      font-weight: bold;
    }

    .qty {
      margin-top: 5px;
      color: #555;
    }

    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #ff9900;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      font-size: 18px;
    }

    .success {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success h2 {
      color: green;
    }

    .back {
      background: #222;
      color: white;
      margin-top: 15px;
    }

    .error {
      background: #ffe5e5;
      color: #b00000;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }

    @media (max-width: 600px) {
      .cart-item img {
        width: 65px;
        height: 65px;
      }

      .item-name {
        font-size: 15px;
      }

      .total {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  🛍️ SAFARIA
</header>

<div class="container">

  <div id="checkoutPage">

    <div class="box">
      <h2>🛒 Your Cart</h2>

      <div id="cartItems"></div>

      <div class="total">
        Total: ₹<span id="totalAmount">0</span>
      </div>
    </div>

    <div class="box">
      <h2>📦 Delivery Details</h2>

      <label>Full Name</label>
      <input
        type="text"
        id="customerName"
        placeholder="Enter your full name"
      >

      <label>Email</label>
      <input
        type="email"
        id="customerEmail"
        placeholder="Enter your email"
      >

      <label>Phone Number</label>
      <input
        type="tel"
        id="customerPhone"
        placeholder="Enter phone number"
      >

      <label>Shipping Address</label>
      <textarea
        id="shippingAddress"
        placeholder="Enter complete delivery address"
      ></textarea>

      <label>Payment Method</label>

      <select id="paymentMethod">
        <option value="COD">Cash on Delivery</option>
        <option value="UPI">UPI</option>
      </select>

      <div id="errorBox" class="error"></div>

      <button
        id="placeOrderBtn"
        onclick="placeOrder()"
        disabled
      >
        Place Order
      </button>

    </div>

  </div>

  <div id="successPage" class="box success">

    <h2>🎉 Order Placed Successfully!</h2>

    <p style="margin-top:15px;">
      Your order has been received.
    </p>

    <p style="margin-top:10px;">
      Order ID:
      <strong id="successOrderId"></strong>
    </p>

    <button
      class="back"
      onclick="window.location.href='index.html'"
    >
      Continue Shopping
    </button>

  </div>

</div>


<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://dcwdzbejpwvskajukxrh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_1IsM8N7-OEcBJyIH5HnsFw_cl6F5oPU";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     CART
  ============================== */

  let cart = [];

  let totalAmount = 0;

  let currentSession = null;


  function readCart() {

    try {

      const raw =
        localStorage.getItem("safaria_cart");

      console.log(
        "SAFARIA CART RAW:",
        raw
      );

      if (!raw) {
        return [];
      }

      const parsed =
        JSON.parse(raw);

      if (!Array.isArray(parsed)) {
        return [];
      }

      return parsed;

    } catch (error) {

      console.error(
        "Cart read error:",
        error
      );

      return [];

    }

  }


  function loadCart() {

    cart = readCart();

    const cartItems =
      document.getElementById("cartItems");

    const totalElement =
      document.getElementById("totalAmount");

    totalAmount = 0;

    cartItems.innerHTML = "";


    if (!cart.length) {

      cartItems.innerHTML = `
        <div class="empty">
          🛒 Your cart is empty.
          <br><br>
          <button
            class="back"
            onclick="window.location.href='index.html'"
          >
            Go Shopping
          </button>
        </div>
      `;

      totalElement.textContent = "0";

      document.getElementById(
        "placeOrderBtn"
      ).disabled = true;

      return;

    }


    cart.forEach(function(item) {

      const quantity =
        Math.max(
          1,
          Number(item.quantity || 1)
        );

      const price =
        Math.max(
          0,
          Number(item.price || 0)
        );

      const itemTotal =
        price * quantity;

      totalAmount += itemTotal;


      const div =
        document.createElement("div");

      div.className = "cart-item";


      const image =
        item.image || "";


      div.innerHTML = `

        ${
          image
            ? `<img
                src="${escapeHTML(image)}"
                alt=""
                onerror="this.style.display='none'"
              >`
            : ""
        }

        <div class="item-info">

          <div class="item-name">
            ${escapeHTML(
              String(item.name || "Product")
            )}
          </div>

          <div class="item-price">
            ₹${price.toLocaleString("en-IN")}
          </div>

          <div class="qty">
            Quantity: ${quantity}
          </div>

        </div>

        <div>
          ₹${itemTotal.toLocaleString("en-IN")}
        </div>

      `;


      cartItems.appendChild(div);

    });


    totalElement.textContent =
      totalAmount.toLocaleString("en-IN");


    document.getElementById(
      "placeOrderBtn"
    ).disabled = false;

  }


  /* ==============================
     SECURITY ESCAPE
  ============================== */

  function escapeHTML(value) {

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* ==============================
     LOGIN CHECK
  ============================== */

  async function checkLogin() {

    try {

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      currentSession =
        data?.session || null;


      if (
        currentSession &&
        currentSession.user
      ) {

        const user =
          currentSession.user;


        const email =
          user.email || "";


        document.getElementById(
          "customerEmail"
        ).value = email;


        const metadata =
          user.user_metadata || {};


        const possibleName =
          metadata.full_name ||
          metadata.name ||
          "";


        if (possibleName) {

          document.getElementById(
            "customerName"
          ).value =
            possibleName;

        }

      }

    } catch (error) {

      console.error(
        "Login check error:",
        error
      );

    }

  }


  /* ==============================
     PLACE ORDER
  ============================== */

  async function placeOrder() {

    const button =
      document.getElementById(
        "placeOrderBtn"
      );

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.style.display = "none";


    /* ALWAYS READ CART AGAIN */

    cart = readCart();


    if (!cart.length) {

      showError(
        "Your cart is empty. Please add a product first."
      );

      return;

    }


    const name =
      document.getElementById(
        "customerName"
      ).value.trim();


    const email =
      document.getElementById(
        "customerEmail"
      ).value.trim();


    const phone =
      document.getElementById(
        "customerPhone"
      ).value.trim();


    const address =
      document.getElementById(
        "shippingAddress"
      ).value.trim();


    const payment =
      document.getElementById(
        "paymentMethod"
      ).value;


    if (!name) {

      showError(
        "Please enter your name."
      );

      return;

    }


    if (!email) {

      showError(
        "Please enter your email."
      );

      return;

    }


    if (!phone) {

      showError(
        "Please enter your phone number."
      );

      return;

    }


    if (!address) {

      showError(
        "Please enter your shipping address."
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "Placing Order...";


    try {

      /* RECALCULATE TOTAL */

      let finalTotal = 0;


      cart.forEach(function(item) {

        const price =
          Math.max(
            0,
            Number(item.price || 0)
          );

        const quantity =
          Math.max(
            1,
            Number(item.quantity || 1)
          );

        finalTotal +=
          price * quantity;

      });


      const generatedOrderId =
        "SAF-" +
        Date.now() +
        "-" +
        Math.floor(
          1000 +
          Math.random() * 9000
        );


      const orderData = {

        order_id:
          generatedOrderId,

        customer_name:
          name,

        customer_email:
          email,

        customer_phone:
          phone,

        shipping_address:
          address,

        items:
          cart,

        total:
          Number(
            finalTotal.toFixed(2)
          ),

        status:
          "pending",

        payment_method:
          payment,

        user_id:
          currentSession?.user?.id || null

      };


      console.log(
        "SAFARIA ORDER:",
        orderData
      );


      const {
        data,
        error
      } =
        await supabaseClient

          .from("orders")

          .insert([orderData])

          .select(
            "id, order_id"
          )

          .single();


      if (error) {

        console.error(
          "ORDER ERROR:",
          error
        );

        throw error;

      }


      /* CLEAR CART ONLY AFTER SUCCESS */

      localStorage.removeItem(
        "safaria_cart"
      );

      cart = [];


      document.getElementById(
        "successOrderId"
      ).textContent =
        data?.order_id ||
        generatedOrderId;


      document.getElementById(
        "checkoutPage"
      ).style.display =
        "none";


      document.getElementById(
        "successPage"
      ).style.display =
        "block";


    } catch (error) {

      console.error(
        "Place order error:",
        error
      );


      showError(
        "Order failed: " +
        (
          error?.message ||
          "Unknown error"
        )
      );


      button.disabled = false;

      button.textContent =
        "Place Order";

    }

  }


  function showError(message) {

    const errorBox =
      document.getElementById(
        "errorBox"
      );

    errorBox.textContent =
      message;

    errorBox.style.display =
      "block";

  }


  /* ==============================
     START
  ============================== */

  document.addEventListener(
    "DOMContentLoaded",
    async function() {

      console.log(
        "SAFARIA CHECKOUT STARTED"
      );

      loadCart();

      await checkLogin();

    }
  );

</script>

</body>
</html>
