<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFARIA - Checkout</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    header {
      background: #131921;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #ff9900;
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
    }

    .back-btn {
      background: #ff9900;
      color: #111;
      border: none;
      padding: 9px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .cart-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
      align-items: center;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 6px;
      background: #f7f7f7;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .item-price {
      color: #b12704;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #aaa;
      background: #eee;
      border-radius: 5px;
      font-size: 20px;
      cursor: pointer;
    }

    .qty-number {
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      border: none;
      background: #d9534f;
      color: white;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .item-total {
      font-weight: bold;
      min-width: 100px;
      text-align: right;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 16px;
    }

    .grand-total {
      border-top: 1px solid #ddd;
      margin-top: 10px;
      padding-top: 15px;
      font-size: 21px;
      font-weight: bold;
    }

    .place-order {
      width: 100%;
      background: #ffd814;
      border: 1px solid #fcd200;
      padding: 14px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .place-order:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success {
      text-align: center;
      padding: 40px 15px;
    }

    .success h2 {
      color: #198754;
      margin-bottom: 12px;
    }

    .success button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #ff9900;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .cart-item {
        align-items: flex-start;
      }

      .cart-item img {
        width: 75px;
        height: 75px;
      }

      .item-total {
        min-width: auto;
        text-align: left;
        width: 100%;
        margin-top: 5px;
      }

      .cart-item {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">SAFARIA</a>
  <button class="back-btn" onclick="window.location.href='index.html'">
    ← Continue Shopping
  </button>
</header>

<div class="container">

  <h1>🛒 Your Cart & Checkout</h1>

  <div class="box">
    <div id="cartItems"></div>
  </div>

  <div class="box">
    <h2>📦 Delivery Details</h2>

    <br>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="customerName" placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="customerEmail" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="customerPhone" placeholder="Enter phone number">
    </div>

    <div class="form-group">
      <label>Delivery Address</label>
      <textarea id="shippingAddress" placeholder="House / Flat / Street / Area"></textarea>
    </div>

    <div class="form-group">
      <label>Payment Method</label>
      <select id="paymentMethod">
        <option value="COD">Cash on Delivery</option>
        <option value="UPI">UPI</option>
      </select>
    </div>
  </div>

  <div class="box">
    <h2>💰 Order Summary</h2>

    <div class="summary-row">
      <span>Items</span>
      <span id="itemCount">0</span>
    </div>

    <div class="summary-row">
      <span>Subtotal</span>
      <span>₹<span id="subtotal">0.00</span></span>
    </div>

    <div class="summary-row">
      <span>Delivery</span>
      <span>FREE</span>
    </div>

    <div class="summary-row grand-total">
      <span>Total</span>
      <span>₹<span id="total">0.00</span></span>
    </div>

    <button id="placeOrderBtn" class="place-order" onclick="placeOrder()">
      🛍️ Place Order
    </button>
  </div>

</div>

<script>
  /* ================================
     SAFARIA SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://dcwdzbejpwvskajukxrh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_1IsM8N7-OEcBJyIH5HnsFw_cl6F5oPU";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     CART
  ================================= */

  let cart = [];

  function readCart() {
    try {
      const saved =
        localStorage.getItem("safaria_cart");

      if (!saved) {
        return [];
      }

      const parsed =
        JSON.parse(saved);

      if (!Array.isArray(parsed)) {
        return [];
      }

      return parsed.map(item => ({
        ...item,
        price: Number(item.price || 0),
        quantity: Math.max(
          1,
          Number(item.quantity || 1)
        )
      }));

    } catch (error) {
      console.error(
        "SAFARIA cart read error:",
        error
      );

      return [];
    }
  }


  function saveCart() {
    localStorage.setItem(
      "safaria_cart",
      JSON.stringify(cart)
    );
  }


  /* ================================
     RENDER CART
  ================================= */

  function renderCart() {

    cart = readCart();

    const container =
      document.getElementById("cartItems");

    const itemCount =
      document.getElementById("itemCount");

    const subtotalElement =
      document.getElementById("subtotal");

    const totalElement =
      document.getElementById("total");

    if (!cart.length) {

      container.innerHTML = `
        <div class="empty">
          🛒 Your cart is empty.
          <br><br>
          <button
            class="back-btn"
            onclick="window.location.href='index.html'"
          >
            Continue Shopping
          </button>
        </div>
      `;

      itemCount.textContent = "0";
      subtotalElement.textContent = "0.00";
      totalElement.textContent = "0.00";

      return;
    }

    let totalItems = 0;
    let subtotal = 0;

    container.innerHTML = "";

    cart.forEach((item, index) => {

      const quantity =
        Math.max(
          1,
          Number(item.quantity || 1)
        );

      const price =
        Number(item.price || 0);

      const itemTotal =
        price * quantity;

      totalItems += quantity;
      subtotal += itemTotal;

      const div =
        document.createElement("div");

      div.className = "cart-item";

      div.innerHTML = `
        <img
          src="${escapeHtml(item.image || '')}"
          alt="${escapeHtml(item.name || 'Product')}"
          onerror="this.style.display='none'"
        >

        <div class="item-info">

          <div class="item-name">
            ${escapeHtml(item.name || "Product")}
          </div>

          <div class="item-price">
            ₹${price.toFixed(2)}
          </div>

          <div class="quantity-box">

            <button
              type="button"
              class="qty-btn"
              onclick="decreaseQuantity(${index})"
            >
              −
            </button>

            <span class="qty-number">
              ${quantity}
            </span>

            <button
              type="button"
              class="qty-btn"
              onclick="increaseQuantity(${index})"
            >
              +
            </button>

            <button
              type="button"
              class="remove-btn"
              onclick="removeFromCart(${index})"
            >
              🗑️ Remove from Cart
            </button>

          </div>

        </div>

        <div class="item-total">
          ₹${itemTotal.toFixed(2)}
        </div>
      `;

      container.appendChild(div);
    });

    itemCount.textContent =
      totalItems;

    subtotalElement.textContent =
      subtotal.toFixed(2);

    totalElement.textContent =
      subtotal.toFixed(2);
  }


  /* ================================
     QUANTITY
  ================================= */

  function increaseQuantity(index) {

    cart = readCart();

    if (!cart[index]) {
      return;
    }

    cart[index].quantity =
      Number(cart[index].quantity || 1) + 1;

    saveCart();

    renderCart();
  }


  function decreaseQuantity(index) {

    cart = readCart();

    if (!cart[index]) {
      return;
    }

    const quantity =
      Number(cart[index].quantity || 1);

    if (quantity <= 1) {
      removeFromCart(index);
      return;
    }

    cart[index].quantity =
      quantity - 1;

    saveCart();

    renderCart();
  }


  /* ================================
     REMOVE
  ================================= */

  function removeFromCart(index) {

    cart = readCart();

    if (!cart[index]) {
      return;
    }

    const productName =
      cart[index].name || "this product";

    const confirmed =
      confirm(
        `Remove "${productName}" from cart?`
      );

    if (!confirmed) {
      return;
    }

    cart.splice(index, 1);

    saveCart();

    renderCart();
  }


  /* ================================
     PLACE ORDER
  ================================= */

  async function placeOrder() {

    cart = readCart();

    if (!cart.length) {
      alert("🛒 Your cart is empty.");
      return;
    }

    const name =
      document
        .getElementById("customerName")
        .value
        .trim();

    const email =
      document
        .getElementById("customerEmail")
        .value
        .trim();

    const phone =
      document
        .getElementById("customerPhone")
        .value
        .trim();

    const address =
      document
        .getElementById("shippingAddress")
        .value
        .trim();

    const payment =
      document
        .getElementById("paymentMethod")
        .value;

    if (!name) {
      alert("Please enter your name.");
      return;
    }

    if (!email) {
      alert("Please enter your email.");
      return;
    }

    if (!phone) {
      alert("Please enter your phone number.");
      return;
    }

    if (!address) {
      alert("Please enter your delivery address.");
      return;
    }

    let total = 0;

    cart.forEach(item => {
      total +=
        Number(item.price || 0) *
        Math.max(
          1,
          Number(item.quantity || 1)
        );
    });

    const finalTotal =
      Number(total.toFixed(2));

    const button =
      document.getElementById(
        "placeOrderBtn"
      );

    button.disabled = true;
    button.textContent =
      "Placing Order...";


    try {

      const {
        data: {
          session
        } = {}
      } =
        await supabaseClient
          .auth
          .getSession();

      const currentSession =
        session || null;


      const generatedOrderId =
        "SAF-" +
        Math.floor(
          100000 +
          Math.random() * 900000
        );


      const orderData = {

        order_id:
          generatedOrderId,

        customer_name:
          name,

        customer_email:
          email,

        customer_phone:
          phone,

        shipping_address:
          address,

        items:
          cart,

        total:
          finalTotal,

        status:
          "pending",

        payment_method:
          payment,

        user_id:
          currentSession?.user?.id || null
      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("orders")
          .insert([orderData])
          .select("id, order_id");


      if (error) {
        console.error(
          "Order error:",
          error
        );

        alert(
          "❌ Order failed.\n\n" +
          error.message
        );

        button.disabled = false;
        button.textContent =
          "🛍️ Place Order";

        return;
      }


      localStorage.removeItem(
        "safaria_cart"
      );

      cart = [];


      document
        .querySelector(".container")
        .innerHTML = `

          <div class="box success">

            <h2>
              ✅ Order Successful!
            </h2>

            <p>
              Thank you for shopping with SAFARIA.
            </p>

            <br>

            <p>
              <strong>Order ID:</strong>
              ${escapeHtml(generatedOrderId)}
            </p>

            <p>
              <strong>Total:</strong>
              ₹${finalTotal.toFixed(2)}
            </p>

            <p>
              <strong>Payment:</strong>
              ${escapeHtml(payment)}
            </p>

            <button
              onclick="window.location.href='my-orders.html'"
            >
              📦 View My Orders
            </button>

            <button
              onclick="window.location.href='index.html'"
              style="margin-left:8px;"
            >
              🏠 Continue Shopping
            </button>

          </div>
        `;

    } catch (error) {

      console.error(
        "Unexpected order error:",
        error
      );

      alert(
        "❌ Something went wrong. Please try again."
      );

      button.disabled = false;
      button.textContent =
        "🛍️ Place Order";
    }
  }


  /* ================================
     SECURITY / HTML ESCAPE
  ================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* ================================
     START
  ================================= */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      cart = readCart();

      console.log(
        "SAFARIA Cart:",
        cart
      );

      renderCart();
    }
  );

</script>

</body>
</html>
