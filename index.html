<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAFARIA - India's Shopping Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    /* HEADER */

    header {
      background: #131921;
      color: white;
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 1400px;
      margin: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #ff9900;
      white-space: nowrap;
    }

    .search-box {
      flex: 1;
      display: flex;
      max-width: 700px;
      margin: auto;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .search-box button {
      width: 55px;
      border: none;
      background: #febd69;
      cursor: pointer;
      font-size: 20px;
    }

    .cart-button {
      background: transparent;
      color: white;
      border: none;
      font-size: 17px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* NAV */

    nav {
      background: #232f3e;
      color: white;
      display: flex;
      gap: 20px;
      padding: 12px;
      overflow-x: auto;
    }

    nav button {
      background: transparent;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 15px;
      white-space: nowrap;
    }

    nav button:hover {
      color: #ff9900;
    }

    /* HERO */

    .hero {
      background: white;
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
    }

    /* CATEGORIES */

    .categories {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      padding: 20px;
      max-width: 1400px;
      margin: auto;
    }

    .category {
      background: white;
      padding: 20px 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }

    .category:hover {
      transform: translateY(-2px);
    }

    .category-icon {
      font-size: 35px;
      margin-bottom: 8px;
    }

    /* PRODUCTS */

    .products-section {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    .products-section h2 {
      margin-bottom: 20px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    .product-card {
      background: white;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.12);
      overflow: hidden;
    }

    .product-image {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-info {
      padding-top: 10px;
    }

    .product-info h3 {
      font-size: 16px;
      min-height: 40px;
    }

    .product-category {
      color: #666;
      font-size: 13px;
      margin: 5px 0;
    }

    .product-price {
      font-size: 21px;
      font-weight: bold;
      margin: 10px 0;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 11px;
      background: #ffd814;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-to-cart-btn:hover {
      background: #f7ca00;
    }

    /* CART */

    #cartPanel {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 390px;
      max-width: 95%;
      height: 100vh;
      background: white;
      z-index: 9999;
      box-shadow: -5px 0 20px rgba(0,0,0,.3);
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      background: #131921;
      color: white;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .cart-header button {
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    #cartItems {
      padding: 15px;
    }

    .cart-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .cart-item img {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quantity-controls button {
      width: 30px;
      height: 30px;
      border: 1px solid #bbb;
      background: white;
      cursor: pointer;
      font-size: 18px;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: red;
      cursor: pointer;
      margin-top: 5px;
    }

    .cart-footer {
      padding: 18px;
      border-top: 1px solid #ddd;
      background: white;
      position: sticky;
      bottom: 0;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #ff9900;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    /* CHECKOUT */

    #checkout {
      display: none;
      background: white;
      max-width: 700px;
      margin: 25px auto;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    #checkout h2 {
      margin-bottom: 20px;
    }

    #checkout input,
    #checkout select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 15px;
    }

    .place-order {
      width: 100%;
      padding: 14px;
      border: none;
      background: #ff9900;
      font-size: 17px;
      font-weight: bold;
      border-radius: 7px;
      cursor: pointer;
    }

    /* FOOTER */

    footer {
      background: #131921;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 30px;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .categories {
        grid-template-columns: repeat(3, 1fr);
      }

      #products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .topbar {
        flex-wrap: wrap;
      }

      .logo {
        width: 100%;
        text-align: center;
      }

      .search-box {
        order: 2;
        width: 100%;
      }

      .cart-button {
        margin: auto;
      }

      .categories {
        grid-template-columns: repeat(2, 1fr);
      }

      #products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-image {
        height: 150px;
      }

      .product-info h3 {
        font-size: 14px;
      }

      .product-price {
        font-size: 18px;
      }

      #cartPanel {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="topbar">

      <div class="logo">
        SAFARIA
      </div>

      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          placeholder="Search products..."
        >

        <button onclick="searchProducts()">
          🔍
        </button>
      </div>

      <button
        id="cartButton"
        class="cart-button"
        onclick="openCart()"
      >
        🛒 Cart (<span id="cartCount">0</span>)
      </button>

    </div>

  </header>


  <!-- NAVIGATION -->

  <nav>

    <button onclick="filterCategory('all')">
      All
    </button>

    <button onclick="filterCategory('Electronics')">
      Electronics
    </button>

    <button onclick="filterCategory('Fashion')">
      Fashion
    </button>

    <button onclick="filterCategory('Mobiles')">
      Mobiles
    </button>

    <button onclick="filterCategory('Home')">
      Home
    </button>

    <button onclick="filterCategory('Beauty')">
      Beauty
    </button>

    <button onclick="filterCategory('Grocery')">
      Grocery
    </button>

  </nav>


  <!-- HERO -->

  <section class="hero">

    <h1>
      Welcome to SAFARIA
    </h1>

    <p>
      Everything you need, all in one place.
    </p>

  </section>


  <!-- CATEGORY BOXES -->

  <section class="categories">

    <div
      class="category"
      onclick="filterCategory('Electronics')"
    >
      <div class="category-icon">📱</div>
      Electronics
    </div>

    <div
      class="category"
      onclick="filterCategory('Fashion')"
    >
      <div class="category-icon">👕</div>
      Fashion
    </div>

    <div
      class="category"
      onclick="filterCategory('Mobiles')"
    >
      <div class="category-icon">📱</div>
      Mobiles
    </div>

    <div
      class="category"
      onclick="filterCategory('Home')"
    >
      <div class="category-icon">🏠</div>
      Home
    </div>

    <div
      class="category"
      onclick="filterCategory('Beauty')"
    >
      <div class="category-icon">💄</div>
      Beauty
    </div>

    <div
      class="category"
      onclick="filterCategory('Grocery')"
    >
      <div class="category-icon">🛒</div>
      Grocery
    </div>

  </section>


  <!-- PRODUCTS -->

  <section class="products-section">

    <h2>
      🛍️ Latest Products
    </h2>

    <div id="products">
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
      ">
        ⏳ Loading products...
      </div>
    </div>

  </section>


  <!-- CART PANEL -->

  <aside id="cartPanel">

    <div class="cart-header">

      <h2>
        🛒 Your Cart
      </h2>

      <button onclick="closeCart()">
        ✕
      </button>

    </div>

    <div id="cartItems">
    </div>

    <div class="cart-footer">

      <div class="cart-total">

        <span>
          Total
        </span>

        <span id="cartTotal">
          ₹0
        </span>

      </div>

      <button
        class="checkout-btn"
        onclick="
          document.getElementById('checkout').style.display='block';
          closeCart();
          document.getElementById('checkout').scrollIntoView({
            behavior:'smooth'
          });
        "
      >
        Proceed to Checkout
      </button>

    </div>

  </aside>


  <!-- CHECKOUT -->

  <section id="checkout">

    <h2>
      📦 Delivery Details
    </h2>

    <input
      id="customerName"
      type="text"
      placeholder="Full Name"
    >

    <input
      id="customerPhone"
      type="tel"
      placeholder="Mobile Number"
    >

    <input
      id="address"
      type="text"
      placeholder="Full Address"
    >

    <input
      id="city"
      type="text"
      placeholder="City"
    >

    <input
      id="pin"
      type="number"
      placeholder="PIN Code"
    >

    <select id="paymentMethod">

      <option value="Cash on Delivery">
        Cash on Delivery
      </option>

      <option value="UPI">
        UPI
      </option>

    </select>

    <button
      class="place-order"
      onclick="placeOrder()"
    >
      🛍️ Place Order
    </button>

  </section>


  <!-- FOOTER -->

  <footer>

    <h2>
      SAFARIA
    </h2>

    <p>
      India's Shopping Store
    </p>

    <br>

    <p>
      © 2026 SAFARIA. All rights reserved.
    </p>

  </footer>


  <!-- YOUR EXISTING SCRIPT -->

  <script src="script.js"></script>

</body>
</html>
